name: Code Coverage

on:
  push:
    branches:
      - main
      - FEATURES/SharedKernel-NuGet-Consumption
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Measure and publish Example Web coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Create coverage settings
        shell: bash
        run: |
          cat > /tmp/example-coverage.runsettings <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <DataCollectionRunSettings>
              <DataCollectors>
                <DataCollector friendlyName="XPlat Code Coverage">
                  <Configuration>
                    <Format>cobertura</Format>
                    <Include>[KUKULCAN.SharedKernel.Example.Web]*</Include>
                    <Exclude>[KUKULCAN.SharedKernel.Example.Web.IntegrationTests]*</Exclude>
                    <ExcludeByAttribute>CompilerGeneratedAttribute</ExcludeByAttribute>
                    <SingleHit>false</SingleHit>
                    <UseSourceLink>true</UseSourceLink>
                    <SkipAutoProps>true</SkipAutoProps>
                  </Configuration>
                </DataCollector>
              </DataCollectors>
            </DataCollectionRunSettings>
          </RunSettings>
          EOF

      - name: Restore
        run: dotnet restore KUKULCAN.SharedKernel.Example.slnx

      - name: Build
        run: dotnet build KUKULCAN.SharedKernel.Example.slnx --no-restore --configuration Release

      - name: Run integration tests with coverage
        run: >-
          dotnet test
          Tests/KUKULCAN.SharedKernel.Example.Web.IntegrationTests/KUKULCAN.SharedKernel.Example.Web.IntegrationTests.csproj
          --no-build --configuration Release
          --settings /tmp/example-coverage.runsettings
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: kukulcan-sharedkernel-example-web-coverage
          path: Tests/KUKULCAN.SharedKernel.Example.Web.IntegrationTests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
