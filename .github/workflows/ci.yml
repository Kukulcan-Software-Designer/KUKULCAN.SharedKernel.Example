name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Restore, build and test Example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database-provider:
          - PostgresSql
          - MySql
          - SqlServer

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout Auth migration sources
        uses: actions/checkout@v5
        with:
          repository: Kukulcan-Software-Designer/KUKULCAN.SharedKernel.Auth
          ref: 0932ab3a7215a9128cc0eb41740262803a81ef73
          path: _external/KUKULCAN.SharedKernel.Auth
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KUKULCAN.SharedKernel.Example.slnx

      - name: Build
        run: dotnet build KUKULCAN.SharedKernel.Example.slnx --configuration Release --no-restore

      - name: Test application and Web API projects without database configuration
        run: |
          dotnet test Tests/KUKULCAN.SharedKernel.Example.Application.Tests/KUKULCAN.SharedKernel.Example.Application.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=detailed"
          dotnet test Tests/KUKULCAN.SharedKernel.Example.Domain.Tests/KUKULCAN.SharedKernel.Example.Domain.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=detailed"
          dotnet test Tests/KUKULCAN.SharedKernel.Example.WebApi.Tests/KUKULCAN.SharedKernel.Example.WebApi.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=detailed"

      - name: Test database integration projects
        env:
          KUKULCAN__DATABASE__PROVIDER: ${{ matrix.database-provider }}
        run: dotnet test Tests/KUKULCAN.SharedKernel.Example.Infrastructure.IntegrationTests/KUKULCAN.SharedKernel.Example.Infrastructure.IntegrationTests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=detailed"
