name: Reference Client

on:
  push:
    branches:
      - main
      - 'CLIENT/**'
      - 'FEATURES/**'
  pull_request:
    branches:
      - main
      - Develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-client:
    name: Build KUKULCAN.SharedKernel.Example.Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Web application
        run: dotnet restore Source/KUKULCAN.SharedKernel.Example.Web/KUKULCAN.SharedKernel.Example.Web.csproj

      - name: Build Web application
        run: dotnet build Source/KUKULCAN.SharedKernel.Example.Web/KUKULCAN.SharedKernel.Example.Web.csproj --no-restore --configuration Release
