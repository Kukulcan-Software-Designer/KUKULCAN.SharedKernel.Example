name: Reference Client

on:
  push:
    branches:
      - main
      - 'CLIENT/**'
      - 'FEATURES/**'
  pull_request:
    branches:
      - main
      - Develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-webapi:
    name: Build Example Web API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build Web API when present
        shell: bash
        run: |
          project="Source/WebAPI/KUKULCAN.SharedKernel.Example.WebApi/KUKULCAN.SharedKernel.Example.WebApi.csproj"
          if [ -f "$project" ]; then
            dotnet restore "$project"
            dotnet build "$project" --no-restore --configuration Release
          else
            echo "::error::Required Web API project is missing: $project"
            exit 1
          fi

  build-dotnet-web-interfaces:
    name: Build Razor and Blazor clients
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build Razor and Blazor
        shell: bash
        run: |
          projects=(
            "Source/WebInterfaces/KUKULCAN.SharedKernel.Example.Razor/KUKULCAN.SharedKernel.Example.Razor.csproj"
            "Source/WebInterfaces/KUKULCAN.SharedKernel.Example.Blazor/KUKULCAN.SharedKernel.Example.Blazor.csproj"
          )

          for project in "${projects[@]}"; do
            if [ ! -f "$project" ]; then
              echo "::error::Required web interface project is missing: $project"
              exit 1
            fi

            dotnet restore "$project"
            dotnet build "$project" --no-restore --configuration Release
          done

  build-angular:
    name: Build Angular client when present
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install and build Angular client when present
        shell: bash
        run: |
          project_dir="Source/WebInterfaces/KUKULCAN.SharedKernel.Example.Angular"
          if [ -f "$project_dir/package.json" ]; then
            npm --prefix "$project_dir" ci
            npm --prefix "$project_dir" run build
            npm --prefix "$project_dir" run test -- --watch=false
          else
            echo "::error::Required Angular client project is missing: $project_dir/package.json"
            exit 1
          fi

  build-react:
    name: Build React client when present
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install and build React client when present
        shell: bash
        run: |
          project_dir="Source/WebInterfaces/KUKULCAN.SharedKernel.Example.React"
          if [ -f "$project_dir/package.json" ]; then
            npm --prefix "$project_dir" ci
            npm --prefix "$project_dir" run build
            npm --prefix "$project_dir" run lint
          else
            echo "::error::Required React client project is missing: $project_dir/package.json"
            exit 1
          fi
